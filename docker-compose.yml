services:
  cdaily:
    build: .
    container_name: cdaily_widget
    ports:
      - "54321:7890"
    volumes:
      # Monta la base de datos de blogwatcher y la configuración
      - ${HOME}/.blogwatcher-cli:/.blogwatcher-cli
      # Docker override: usa config con host: 0.0.0.0 para port forwarding
      - /tmp/cdaily-docker-config.yaml:/app/config.yaml:ro
      # Monta el binario de blogwatcher-cli
      - ${HOME}/.local/bin/blogwatcher-cli:/usr/local/bin/blogwatcher-cli:ro
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      TZ: America/Santiago
      CDAILY_CONFIG: /app/config.yaml
      CDAILY_AI_ENDPOINT: ${CDAILY_AI_ENDPOINT:-http://host.docker.internal:12345/v1/chat/completions}
      CDAILY_AI_API_KEY: ${CDAILY_AI_API_KEY:-}
