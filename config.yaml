host: "127.0.0.1"
port: 7890
db_path: "~/.blogwatcher-cli/blogwatcher-cli.db"
scan_interval_minutes: 30
refresh_interval_seconds: 60
log_level: "INFO"

# AI summarization (optional)
ai_preferences:
  enabled: true
  endpoint: "http://localhost:12345/v1/chat/completions"
  model: "qwen2.5-7b-instruct-1m"
  max_content_chars: 12000
  system_prompt: >
    Summarize the article in 3 very short bullet points.
    Focus on practical takeaways, key facts, and the main implication.
    If the article is too short or invalid, say: "Not enough content to summarize."

# Generic category mapping for new users
blog_categories:
  "CIPER Chile": news
  "BioBioChile": news
  "Cambio21": news
  "El Clarin": news
  "The Clinic": culture
  "BBC Mundo": news
  "The Guardian Mundo": news
  "Ars Technica": tech
  "Science Daily": science
  "Diario Financiero": business
  "The Onion": culture
  "CyberScoop": security
  "Dark Reading": security
  "Help Net Security": security
  "Infosecurity Magazine": security
  "Krebs on Security": security
  "MIT Tech Review AI": tech
  "SANS ISC": security
  "Schneier on Security": security
  "Talos Intelligence": security
  "The Hacker News": security
  "The Verge AI": tech
  "Unit 42 Palo Alto": security
  "We Live Security": security

category_emoji:
  news: "📰"
  tech: "💻"
  science: "🔬"
  business: "💼"
  culture: "🎭"
  security: "🔐"
  default: "📰"
