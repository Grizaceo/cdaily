[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cdaily"
dynamic = ["version"]
description = "Minimalist ambient feed reader reading directly from blogwatcher-cli"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Cristóbal", email = "gris@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.3",
    "pyyaml>=6.0.1",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.0",
    "slowapi>=0.1.9",
    "pydantic>=2.0.0",
    "mcp[cli]>=1.2",
]

[project.scripts]
cdaily = "cdaily.main:main"
cdaily-mcp = "cdaily.mcp_server:main"
cdaily-blogwatch-mcp = "cdaily.blogwatch_mcp_server:main"

[tool.hatch.version]
source = "regex"
path = "VERSION"
pattern = "(?P<version>[^\n]+)"

[tool.hatch.build.targets.wheel]
packages = ["cdaily"]

[tool.black]
line-length = 120
target-version = ['py311']
